name: macOS build
on:
  push:
    branches: [release-1.3.2, release-1.3.1, release-1.3.0, spoolman-integration, release-1.2.1, main, fix/stable-release-hardening, v1.1-beta-prep, v1.2-beta-integration-build]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/sender.txt
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean packaging/SnapmakerSpoolTracker.spec
      - name: Smoke-test and verify package
        run: |
          dist/SnapmakerSpoolTracker-1.3.3rc4.app/Contents/MacOS/SnapmakerSpoolTracker --self-test
          codesign --verify --deep --strict dist/SnapmakerSpoolTracker-1.3.3rc4.app
      - name: Assemble distribution
        run: python scripts/package_release.py macOS dist/SnapmakerSpoolTracker-1.3.3rc4.app
      - name: Build provenance
        run: python scripts/write_build_info.py dist/SnapmakerSpoolTracker-1.3.3rc4-macOS.zip dist/BUILD-INFO-macOS.json
      - uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-1.3.3rc4-macOS
          path: |
            dist/SnapmakerSpoolTracker-1.3.3rc4-macOS.zip*
            dist/BUILD-INFO-macOS.json
          if-no-files-found: error
