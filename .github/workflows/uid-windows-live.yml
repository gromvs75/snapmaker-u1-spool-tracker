name: Tracker 2 Windows EXE live processes
on:
  push:
    branches: ['test/uid-windows-live']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-processes:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      WSL_UTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen Windows GUI
        run: |
          python -m pip install pyinstaller==6.16.0 pywebview==6.2.1 Pillow==11.3.0 pywin32==311 filelock==3.16.1
          python -m PyInstaller --clean --noconfirm packaging/TrackerUidGuiWindows.spec
      - name: Prepare disposable Ubuntu WSL1
        shell: pwsh
        run: |
          $base = 'https://cloud-images.ubuntu.com/wsl/jammy/current/'
          $name = 'ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz'
          $archive = Join-Path $env:RUNNER_TEMP $name
          curl.exe --fail --location --retry 3 ($base+$name) --output $archive
          if ($LASTEXITCODE) { throw 'Rootfs download failed' }
          $sumFile = Join-Path $env:RUNNER_TEMP 'ubuntu-SHA256SUMS'
          curl.exe --fail --location ($base+'SHA256SUMS') --output $sumFile
          if ($LASTEXITCODE) { throw 'Checksum download failed' }
          $sums = Get-Content $sumFile -Raw
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expected = (($sums -split "`n" | Where-Object { $_.EndsWith($name) }) -split '\s+')[0]
          if ($hash -ne $expected) { throw "Rootfs checksum mismatch: $hash vs $expected" }
          wsl --import TrackerBench (Join-Path $env:RUNNER_TEMP 'tracker-wsl') $archive --version 1
          if ($LASTEXITCODE) { throw 'WSL import failed' }
          $repo = (wsl -d TrackerBench -- wslpath -u $env:GITHUB_WORKSPACE).Trim()
          wsl -d TrackerBench -- bash -c "tr -d '\r' < '$repo/dev/labs/uid_windows_live_bench/prepare.sh' | bash"
          if ($LASTEXITCODE) { throw 'Linux preparation failed' }
      - name: Run packaged GUI against four real Linux processes
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'output/uid-windows-live'
          New-Item -ItemType Directory -Force $out | Out-Null
          $repo = (wsl -d TrackerBench -- wslpath -u $env:GITHUB_WORKSPACE).Trim()
          $linuxOut = (wsl -d TrackerBench -- wslpath -u $out).Trim()
          $args = @('-d','TrackerBench','--','/tmp/tracker-live-source/env/bin/python',"$repo/dev/labs/uid_windows_live_bench/supervisor.py",'--output',$linuxOut)
          $supervisor = Start-Process wsl.exe -ArgumentList $args -PassThru -RedirectStandardOutput "$out/supervisor.out" -RedirectStandardError "$out/supervisor.err"
          $manifest = Join-Path $out 'manifest.json'
          try {
            $deadline = (Get-Date).AddSeconds(150)
            while (!(Test-Path $manifest) -and (Get-Date) -lt $deadline -and !$supervisor.HasExited) { Start-Sleep -Seconds 1 }
            if (!(Test-Path $manifest)) { throw 'Process benches not ready; inspect supervisor logs' }
            $benchDir = Join-Path $env:RUNNER_TEMP 'TrackerLiveEXE'
            New-Item -ItemType Directory -Force $benchDir | Out-Null
            Copy-Item dist/Tracker-2.0-Windows-Bench.exe $benchDir
            $exe = Join-Path $benchDir 'Tracker-2.0-Windows-Bench.exe'
            Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
            Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
            $process = Start-Process $exe -ArgumentList @('--ci-live',('"'+$manifest+'"'),'--output',('"'+$out+'"')) -WorkingDirectory $benchDir -PassThru
            if (!$process.WaitForExit(420000)) { taskkill /PID $process.Id /T /F; throw 'EXE timed out' }
            if ($process.ExitCode -ne 0) { throw "Live EXE failed: $($process.ExitCode)" }
            $result = Get-Content "$out/live-result.json" -Raw | ConvertFrom-Json
            if (!$result.success -or !$result.frozen) { throw 'Missing successful frozen result' }
            Get-FileHash $exe -Algorithm SHA256 | Format-List | Out-File "$out/sha256.txt"
          } finally {
            if (Test-Path $manifest) {
              $cfg = Get-Content $manifest -Raw | ConvertFrom-Json
              Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18780/' -Headers @{'X-Bench-Token'=$cfg.token} -ContentType 'application/json' -Body '{"action":"shutdown"}'
              if (!$supervisor.WaitForExit(45000)) { throw 'Supervisor cleanup timed out' }
              $cleanup = Get-Content "$out/processes.json" -Raw | ConvertFrom-Json
              if (!$cleanup.stopped -or $cleanup.cleanup_errors.Count) { throw 'Process cleanup failed' }
            }
          }
      - name: Remove disposable Linux instance
        if: always()
        shell: pwsh
        run: |
          wsl --terminate TrackerBench
          wsl --unregister TrackerBench
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tracker-windows-live-evidence
          path: |
            output/uid-windows-live/
            !output/uid-windows-live/manifest.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Tracker-2.0-Windows-Live-Bench
          path: dist/Tracker-2.0-Windows-Bench.exe
