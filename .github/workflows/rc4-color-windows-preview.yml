name: rc4 overview and next-print forecast Windows preview
on:
  push:
    branches: ['test/rc4-color-forecast-20261120']
permissions:
  contents: read
jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install isolated build and test dependencies
        run: python -m pip install pyinstaller==6.22.3 pystray==0.19.5 pywebview==6.2.1 Pillow==11.3.0 pywin32==311 filelock==3.16.1 websocket-client==1.8.0 pytest==8.3.5 pytest-timeout==2.3.1 pywinauto==0.6.9 playwright==1.56.0 aiohttp==3.11.18
      - run: python -m playwright install chromium
      - name: Build Windows x64 preview
        run: python -m PyInstaller --clean --noconfirm --distpath output/native-dist --workpath output/native-build packaging/TrackerUser.spec
      - name: Verify the actual EXE, WebView2 and Windows tray
        run: python dev/labs/uid_candidate_bench/resumed.py --exe output/native-dist/Snapmaker-Tracker-2.1-Candidate/Snapmaker-Tracker-2.1-Candidate.exe --output output/windows-evidence/native --require-direct-spool-selection
      - name: Verify forecast, real head mapping and manual accounting
        run: python -m pytest tests/test_history_only_review_ui.py tests/test_history_review_ui.py tests/test_history_delivery_flow.py tests/test_uid_history_review.py tests/test_resumed_print_accounting.py tests/test_resumed_print_live.py tests/test_desktop_spoolman.py tests/test_user_launch.py tests/test_uid_forecast.py tests/test_slice_observer.py tests/test_uid_guard.py tests/test_uid_calculated_history.py tests/test_user_hook.py tests/test_user_tray.py tests/test_forecast_library_layout.py tests/test_dashboard.py tests/test_grouped_overview.py -x -q --timeout=90 --junitxml=output/windows-evidence/tests.xml
      - name: Package verified EXE and its runtime
        shell: pwsh
        run: |
          $folder = 'output/native-dist/Snapmaker-Tracker-2.1-Candidate'
          $guide = Get-Content docs/guides/slice-forecast-rc4-preview-ru.md -Raw
          [System.IO.File]::WriteAllText("$pwd/$folder/ИНСТРУКЦИЯ.txt", $guide, [System.Text.UTF8Encoding]::new($true))
          $exe = "$folder/Snapmaker-Tracker-2.1-Candidate.exe"
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne '2.1.0rc4-visual-color-preview') { throw 'Wrong EXE version' }
          $build = Get-Content "$folder/_internal/tracker_build.json" -Raw | ConvertFrom-Json
          if ($build.commit -ne $env:GITHUB_SHA -or $build.dirty) { throw 'Windows EXE does not match the clean Actions checkout' }
          $zip = 'output/windows-delivery/Snapmaker-Tracker-2.1.0rc4-Visual-Color-Preview-Windows-x64.zip'
          New-Item -ItemType Directory -Force output/windows-delivery | Out-Null
          Compress-Archive -LiteralPath $folder -DestinationPath $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  $(Split-Path $zip -Leaf)" | Set-Content "$zip.sha256" -Encoding ascii
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$exeHash  $(Split-Path $exe -Leaf)" | Set-Content output/windows-delivery/EXE.sha256 -Encoding ascii
          Copy-Item "$folder/_internal/tracker_build.json" output/windows-delivery/BUILD-INFO-Windows.json
          Copy-Item output/windows-evidence/native/results.json output/windows-delivery/WINDOWS-NATIVE-VERIFIED.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc4-color-windows-evidence
          path: output/windows-evidence/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rc4-color-windows-tested-exe
          path: output/windows-delivery/
          if-no-files-found: error
          retention-days: 14
