[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapmaker-u1-spool-tracker"
version = "1.3.0"
description = "Local filament inventory and Snorca slice forecasts for Snapmaker U1"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.scripts]
snapmaker-tracker = "spool_tracker:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["accounting", "backup", "feed_evidence", "forecast", "forecast_backup", "forecast_service", "forecast_view", "gcode", "material_guard", "moonraker", "motion_allocation", "motion_analysis", "motion_reconcile", "motion_stream", "physical_usage", "preflight", "presend", "print_statistics", "sender", "sender_view", "slice_observer", "spool_identity", "spoolman_bridge", "spoolman_view", "macos_menu", "spool_tracker", "storage", "tag_evidence", "tool_mapping"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements/runtime.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
