name: RFID rc4 isolated Linux filesystem audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5
      - name: Recovery and path checks as ordinary user
        run: python -m pytest tests/test_rfid_u1_trial.py tests/test_rfid_failure_recovery.py -q
      - name: Real Linux ENOSPC and OverlayFS cleanup
        run: |
          mkdir -p output/linux-audit
          git show ee945b4851d37f9cdc805fb3523136298ac6bf4c:scripts/rfid_u1_trial.py > output/linux-audit/baseline.py
          sudo "$(command -v python)" dev/labs/uid_boot_bench/linux_filesystem_run.py --baseline output/linux-audit/baseline.py --output output/linux-audit/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rfid-rc4-linux-evidence
          path: output/linux-audit/
          retention-days: 14
