name: Windows build
on:
  push:
    branches: [ui/settings-preview, ui/spoolman-rc5, ui/spoolman-compare-editor, fix/spoolman-vendor-label, fix/windows-startup-lock, release-1.3.2, release-1.3.1, release-1.3.0, spoolman-integration, release-1.2.1, main, fix/stable-release-hardening, v1.1-beta-prep, v1.2-beta-integration-build]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/sender.txt
          python -m pip install -e . --no-deps
      - name: Install UI test browser
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install chromium
      - name: Test
        run: python -m pytest -q
      - name: Settings and inventory UI probe
        timeout-minutes: 3
        run: python -m dev.settings_ui_probe
      - name: Native Windows tray probe
        timeout-minutes: 2
        run: python dev/windows_tray_probe.py
      - name: Native Windows comparison screen probe
        timeout-minutes: 2
        run: python -m dev.windows_compare_probe
      - name: Package executable
        run: python -m PyInstaller --noconfirm --clean --paths . --paths src --windowed --onefile --name SnapmakerSpoolTracker-1.3.3rc5-Windows src/spool_tracker.py
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'dist/SnapmakerSpoolTracker-1.3.3rc5-Windows.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Packaged self-test failed: $($app.ExitCode)" }
      - name: Assemble distribution
        run: python scripts/package_release.py Windows dist/SnapmakerSpoolTracker-1.3.3rc5-Windows.exe
      - name: Build provenance
        run: python scripts/write_build_info.py dist/SnapmakerSpoolTracker-1.3.3rc5-Windows.zip dist/BUILD-INFO-Windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-1.3.3rc5-Windows
          path: |
            dist/SnapmakerSpoolTracker-1.3.3rc5-Windows.zip*
            dist/BUILD-INFO-Windows.json
          if-no-files-found: error
