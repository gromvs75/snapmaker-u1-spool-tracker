name: macOS build
on:
  push:
    branches: [main, fix/stable-release-hardening, codex/v1.1-beta-prep, codex/v1.2-beta-integration-build]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-sender.txt
      - name: Test
        run: python -m pytest -q
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean SnapmakerSpoolTracker.spec
      - name: Smoke-test and verify package
        run: |
          dist/SnapmakerSpoolTracker-1.2.0-beta.1.app/Contents/MacOS/SnapmakerSpoolTracker --self-test
          codesign --verify --deep --strict dist/SnapmakerSpoolTracker-1.2.0-beta.1.app
      - name: Zip app bundle
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent SnapmakerSpoolTracker-1.2.0-beta.1.app SnapmakerSpoolTracker-1.2.0-beta.1-macOS.zip
      - name: Checksum
        working-directory: dist
        run: shasum -a 256 SnapmakerSpoolTracker-1.2.0-beta.1-macOS.zip > SnapmakerSpoolTracker-1.2.0-beta.1-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-1.2.0-beta.1-macOS
          path: dist/SnapmakerSpoolTracker-1.2.0-beta.1-macOS.zip*
          if-no-files-found: error
