name: Build Windows Executable

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconsole --onefile \
            --name "SnapmakerSpoolTracker" \
            spool_tracker.py

      - name: Archive Windows build
        shell: bash
        run: |
          cd dist
          powershell Compress-Archive -Path SnapmakerSpoolTracker.exe -DestinationPath SnapmakerSpoolTracker-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-Windows
          path: dist/SnapmakerSpoolTracker-Windows.zip
