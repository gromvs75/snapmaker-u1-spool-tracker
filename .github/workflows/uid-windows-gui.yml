name: Tracker 2 Windows GUI bench
on:
  push:
    branches: ['test/uid-windows-gui']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gui:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pystray==0.19.5 pywebview==6.2.1 Pillow==11.3.0 pywin32==311 filelock==3.16.1 pytest==8.3.5 pytest-timeout==2.3.1
      - name: Accounting, replay, history and reconnect regressions
        run: python -m pytest tests/test_uid_autorefill_boundaries.py tests/test_uid_port_queue.py tests/test_uid_port_shell.py tests/test_uid_port_library.py tests/test_uid_port_presentation.py tests/test_uid_accounting.py tests/test_uid_client.py tests/test_uid_gui.py tests/test_uid_manual.py tests/test_uid_resolution.py tests/test_uid_unlock_window.py tests/test_uid_motion_adapter.py tests/test_uid_motion_lifecycle.py tests/test_uid_runtime.py tests/test_uid_migration.py --timeout=45 --junitxml=output/uid-windows-gui/pytest.xml -q
      - name: Native WebView2 window
        run: python dev/labs/uid_windows_bench/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uid-windows-gui
          path: output/uid-windows-gui/
