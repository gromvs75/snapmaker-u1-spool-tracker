name: macOS build
on:
  push:
    branches: [spoolman-integration, release-1.2.1, main, fix/stable-release-hardening, v1.1-beta-prep, v1.2-beta-integration-build]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/sender.txt
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Package app
        run: python -m PyInstaller --noconfirm --clean packaging/SnapmakerSpoolTracker.spec
      - name: Smoke-test and verify package
        run: |
          dist/SnapmakerSpoolTracker-Spoolman-Preview2.app/Contents/MacOS/SnapmakerSpoolTracker --self-test
          codesign --verify --deep --strict dist/SnapmakerSpoolTracker-Spoolman-Preview2.app
      - name: Zip app bundle
        working-directory: dist
        run: ditto -c -k --sequesterRsrc --keepParent SnapmakerSpoolTracker-Spoolman-Preview2.app SnapmakerSpoolTracker-Spoolman-Preview2-macOS.zip
      - name: Checksum
        working-directory: dist
        run: shasum -a 256 SnapmakerSpoolTracker-Spoolman-Preview2-macOS.zip > SnapmakerSpoolTracker-Spoolman-Preview2-macOS.zip.sha256
      - name: Build provenance
        run: python scripts/write_build_info.py dist/SnapmakerSpoolTracker-Spoolman-Preview2-macOS.zip dist/BUILD-INFO-macOS.json
      - uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-Spoolman-Preview2-macOS
          path: |
            dist/SnapmakerSpoolTracker-Spoolman-Preview2-macOS.zip*
            dist/BUILD-INFO-macOS.json
          if-no-files-found: error
