name: Windows build
on:
  push:
    branches: [main, fix/stable-release-hardening, v1.1-beta-prep, v1.2-beta-integration-build]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/sender.txt
          python -m pip install -e . --no-deps
      - name: Test
        run: python -m pytest -q
      - name: Package executable
        run: python -m PyInstaller --noconfirm --clean --paths . --paths src --windowed --onefile --name SnapmakerSpoolTracker-1.2-beta-Windows src/spool_tracker.py
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'dist/SnapmakerSpoolTracker-1.2-beta-Windows.exe' -ArgumentList '--self-test' -Wait -PassThru
          if ($app.ExitCode -ne 0) { throw "Packaged self-test failed: $($app.ExitCode)" }
      - name: Checksum
        shell: pwsh
        run: |
          $file = 'dist/SnapmakerSpoolTracker-1.2-beta-Windows.exe'
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $file -Leaf)" | Set-Content "$file.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: SnapmakerSpoolTracker-1.2-beta-Windows
          path: dist/SnapmakerSpoolTracker-1.2-beta-Windows.exe*
          if-no-files-found: error
