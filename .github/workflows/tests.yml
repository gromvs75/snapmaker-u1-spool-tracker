name: Tests
on:
  push:
    branches: [release-1.3.2, release-1.3.1, release-1.3.0, release-1.2.1, main, fix/stable-release-hardening]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements/dev.txt -r requirements/sender.txt
          python -m pip install -e . --no-deps
      - name: Install test browser
        run: |
          python -m pip install playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Test
        run: python -m pytest -q
