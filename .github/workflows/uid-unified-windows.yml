name: Tracker 2 current unified Windows build
on:
  push:
    branches: ['integrate/2.0-registration-drawer-spoolman', 'integrate/2.0-history-recovery']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated build dependencies
        run: python -m pip install pystray==0.19.5 pyinstaller==6.16.0 pywebview==6.2.1 Pillow==11.3.0 pywin32==311 filelock==3.16.1 websocket-client==1.8.0 pytest==8.3.5 pytest-timeout==2.3.1 pywinauto==0.6.9 playwright==1.56.0
      - name: Install browser for actual packaged GUI scenario
        run: python -m playwright install chromium
      - name: Current UID delivery settings and shell regressions
        run: python -m pytest tests/test_uid_manual.py tests/test_uid_resolution.py tests/test_uid_unlock_window.py tests/test_uid_tags.py tests/test_uid_delivery.py tests/test_uid_settings_backup.py tests/test_uid_port_shell.py tests/test_uid_collectors.py tests/test_uid_runtime.py tests/test_uid_autorefill_boundaries.py tests/test_uid_recovery.py tests/test_uid_calculated_history.py tests/test_uid_replacements.py tests/test_uid_reconciliation.py tests/test_uid_port_presentation.py --timeout=45 --junitxml=output/unified-windows/tests.xml -q
      - name: Build current unified entrypoint
        run: python -m PyInstaller --clean --noconfirm packaging/TrackerUidSettings.spec
      - name: Verify packaged API settings restore and second process
        run: python dev/labs/uid_unified_bench/packaged_smoke.py --exe dist/Tracker-2.0-Settings-Bench/Tracker-2.0-Settings-Bench.exe --output output/unified-windows
      - name: Verify native window and real tray menu
        run: python dev/labs/uid_unified_bench/native_windows.py --exe dist/Tracker-2.0-Settings-Bench/Tracker-2.0-Settings-Bench.exe --output output/unified-windows
      - name: Prepare disposable Ubuntu WSL1
        shell: pwsh
        run: |
          $base = 'https://cloud-images.ubuntu.com/wsl/jammy/current/'
          $name = 'ubuntu-jammy-wsl-amd64-ubuntu22.04lts.rootfs.tar.gz'
          $archive = Join-Path $env:RUNNER_TEMP $name
          curl.exe --fail --location --retry 3 ($base+$name) --output $archive
          if ($LASTEXITCODE) { throw 'Rootfs download failed' }
          $sumFile = Join-Path $env:RUNNER_TEMP 'ubuntu-SHA256SUMS'
          curl.exe --fail --location ($base+'SHA256SUMS') --output $sumFile
          if ($LASTEXITCODE) { throw 'Checksum download failed' }
          $sums = Get-Content $sumFile -Raw
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          $expected = (($sums -split "`n" | Where-Object { $_.EndsWith($name) }) -split '\s+')[0]
          if ($hash -ne $expected) { throw "Rootfs checksum mismatch: $hash vs $expected" }
          wsl --import TrackerBench (Join-Path $env:RUNNER_TEMP 'tracker-wsl') $archive --version 1
          if ($LASTEXITCODE) { throw 'WSL import failed' }
          $repo = (wsl -d TrackerBench --exec wslpath -u $env:GITHUB_WORKSPACE).Trim()
          wsl -d TrackerBench --exec bash -c "tr -d '\r' < '$repo/dev/labs/uid_windows_live_bench/prepare.sh' | bash"
          if ($LASTEXITCODE) { throw 'Linux preparation failed' }
      - name: Verify current EXE against four real Linux processes
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'output/uid-windows-live'
          New-Item -ItemType Directory -Force $out | Out-Null
          $repo = (wsl -d TrackerBench --exec wslpath -u $env:GITHUB_WORKSPACE).Trim()
          $linuxOut = (wsl -d TrackerBench --exec wslpath -u $out).Trim()
          $args = @('-d','TrackerBench','--exec','/tmp/tracker-live-source/env/bin/python',"$repo/dev/labs/uid_windows_live_bench/supervisor.py",'--output',$linuxOut)
          $supervisor = Start-Process wsl.exe -ArgumentList $args -PassThru -RedirectStandardOutput "$out/supervisor.out" -RedirectStandardError "$out/supervisor.err"
          $manifest = Join-Path $out 'manifest.json'
          try {
            $deadline = (Get-Date).AddSeconds(150)
            while (!(Test-Path $manifest) -and (Get-Date) -lt $deadline -and !$supervisor.HasExited) { Start-Sleep -Seconds 1 }
            if (!(Test-Path $manifest)) { throw 'Process benches not ready; inspect supervisor logs' }
            $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/Tracker-2.0-Settings-Bench/Tracker-2.0-Settings-Bench.exe'
            python dev/labs/uid_unified_bench/live_exe.py --exe "$exe" --manifest "$manifest" --output "$out"
            if ($LASTEXITCODE) { throw 'Current EXE process bench failed' }
            $result = Get-Content "$out/unified-live-result.json" -Raw | ConvertFrom-Json
            if (!$result.success) { throw 'Missing current EXE result' }
            python dev/labs/uid_unified_bench/recovery_exe.py --exe "$exe" --manifest "$manifest" --output "$out" --browser
            if ($LASTEXITCODE) { throw 'Current EXE UID recovery GUI scenario failed' }
          } finally {
            if (Test-Path $manifest) {
              $cfg = Get-Content $manifest -Raw | ConvertFrom-Json
              Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:18780/' -Headers @{'X-Bench-Token'=$cfg.token} -ContentType 'application/json' -Body '{"action":"shutdown"}'
              if (!$supervisor.WaitForExit(45000)) { throw 'Supervisor cleanup timed out' }
              $cleanup = Get-Content "$out/processes.json" -Raw | ConvertFrom-Json
              if (!$cleanup.stopped -or $cleanup.cleanup_errors.Count) { throw 'Process cleanup failed' }
            }
          }
      - name: Remove disposable Linux instance
        if: always()
        shell: pwsh
        run: |
          wsl --terminate TrackerBench
          wsl --unregister TrackerBench
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-unified-windows-results
          path: |
            output/unified-windows/
            output/uid-windows-live/
            !output/uid-windows-live/manifest.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: current-unified-windows-app
          path: dist/Tracker-2.0-Settings-Bench/
